ext {
    storeFile = file(System.getenv("KEYSTORE_FILE") ?: "keystore.jks")
    storePassword = System.getenv("KEYSTORE_PASSWORD") ?: "change-me"
    keyAlias = System.getenv("KEY_ALIAS") ?: "ytplayables"
    keyPassword = System.getenv("KEY_PASSWORD") ?: "change-me"
}

android {
    signingConfigs {
        release {
            storeFile storeFile
            storePassword storePassword
            keyAlias keyAlias
            keyPassword keyPassword
        }
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
}